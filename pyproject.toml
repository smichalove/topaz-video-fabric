[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topaz-video-fabric"
version = "1.0.0"
description = "Heterogeneous Zero-NAND DRAM-Staged 4K Video Upscaling Orchestrator for Apple Silicon ANE and NVIDIA TensorRT/CUDA Clusters"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["video-upscaling", "topaz-video-ai", "distributed-cluster", "apple-silicon", "ane", "cuda", "tensorrt", "ramdisk", "ffmpeg"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Conversion",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
topaz-cluster = "topaz_cluster.orchestrator:main"

[tool.setuptools.packages.find]
where = [".."]
include = ["topaz_cluster*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
